<!-- Modern Game Development Illustration -->
<svg width="600" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FF6584;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF" />
      <stop offset="100%" style="stop-color:#FF6584" />
    </linearGradient>
    <linearGradient id="secondary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF" />
      <stop offset="100%" style="stop-color:#00E676" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="500" fill="url(#bgGrad)" rx="20"/>
  
  <!-- Floating Elements -->
  <circle cx="80" cy="80" r="25" fill="#6C63FF" opacity="0.2">
    <animate attributeName="cy" values="80;90;80" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="100" r="30" fill="#FF6584" opacity="0.2">
    <animate attributeName="cy" values="100;110;100" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="540" cy="400" r="20" fill="#00D4FF" opacity="0.2">
    <animate attributeName="cy" values="400;390;400" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Main Monitor/Screen -->
  <rect x="150" y="100" width="300" height="220" rx="10" fill="#1A1A2E" stroke="url(#primary)" stroke-width="3"/>
  <rect x="160" y="110" width="280" height="180" rx="5" fill="#0F0F1E"/>
  
  <!-- Code Lines on Screen -->
  <rect x="180" y="130" width="120" height="8" rx="4" fill="#6C63FF" opacity="0.7"/>
  <rect x="180" y="150" width="180" height="8" rx="4" fill="#FF6584" opacity="0.7"/>
  <rect x="180" y="170" width="150" height="8" rx="4" fill="#00D4FF" opacity="0.7"/>
  <rect x="180" y="190" width="200" height="8" rx="4" fill="#00E676" opacity="0.7"/>
  <rect x="180" y="210" width="100" height="8" rx="4" fill="#6C63FF" opacity="0.7"/>
  <rect x="180" y="230" width="220" height="8" rx="4" fill="#FF6584" opacity="0.7"/>
  <rect x="180" y="250" width="140" height="8" rx="4" fill="#00D4FF" opacity="0.7"/>
  
  <!-- Monitor Stand -->
  <rect x="280" y="320" width="40" height="60" rx="5" fill="url(#primary)"/>
  <rect x="230" y="380" width="140" height="15" rx="7" fill="url(#primary)"/>
  
  <!-- Game Controller Left -->
  <ellipse cx="120" cy="320" rx="60" ry="50" fill="url(#primary)" opacity="0.9"/>
  <circle cx="100" cy="310" r="12" fill="#1A1A2E"/>
  <circle cx="140" cy="330" r="12" fill="#1A1A2E"/>
  <rect x="110" y="305" width="20" height="3" rx="1.5" fill="#1A1A2E"/>
  <rect x="118" y="297" width="3" height="20" rx="1.5" fill="#1A1A2E"/>
  
  <!-- Game Controller Right -->
  <ellipse cx="480" cy="320" rx="60" ry="50" fill="url(#secondary)" opacity="0.9"/>
  <circle cx="460" cy="310" r="10" fill="#1A1A2E"/>
  <circle cx="500" cy="310" r="10" fill="#1A1A2E"/>
  <circle cx="480" cy="335" r="10" fill="#1A1A2E"/>
  
  <!-- Unity Logo Symbol -->
  <path d="M 300 360 L 285 385 L 315 385 Z" fill="#1A1A2E" opacity="0.8"/>
  <path d="M 300 390 L 315 365 L 285 365 Z" fill="#1A1A2E" opacity="0.8"/>
  <rect x="295" y="365" width="10" height="20" fill="#1A1A2E" opacity="0.8"/>
  
  <!-- Decorative Cubes -->
  <g transform="translate(50, 200)">
    <rect x="0" y="20" width="40" height="40" fill="#6C63FF" opacity="0.6" transform="rotate(45 20 40)"/>
  </g>
  <g transform="translate(510, 220)">
    <rect x="0" y="20" width="35" height="35" fill="#FF6584" opacity="0.6" transform="rotate(45 17.5 37.5)"/>
  </g>
  
  <!-- Stars/Sparkles -->
  <circle cx="420" cy="150" r="3" fill="#FFD600">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="180" r="2.5" fill="#FFD600">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="440" cy="280" r="2" fill="#FFD600">
    <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Text -->
  <text x="300" y="460" font-size="32" font-weight="bold" text-anchor="middle" fill="url(#primary)" font-family="Arial, sans-serif">Game Development</text>
  <text x="300" y="485" font-size="16" font-weight="500" text-anchor="middle" fill="#6C63FF" opacity="0.8" font-family="Arial, sans-serif">Unity · C# · Cross-Platform</text>
</svg>
